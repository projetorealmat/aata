name: REALMat — publicar PDF

on:
  pull_request:
    branches: [master]
    types: [closed]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Número da Release PR mesclada a publicar novamente
        required: true
        type: string

jobs:
  publish:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      github.event_name == 'workflow_dispatch'
    uses: projetorealmat/.github/.github/workflows/book-publish-release.yml@feat/aata-realmat-build-config-contract
    with:
      config: .realmat/book.json
      base_branch: master
      release_pr: ${{ github.event.inputs.release_pr || '' }}
    secrets: inherit
