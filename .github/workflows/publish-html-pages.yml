name: "Publicar HTML traduzido — Álgebra Abstrata"

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar HTML com PreTeXt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout do livro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar assets já gerados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-assets
          cp -a images/. generated-assets/

      - name: Compilar HTML na imagem oficial do PreTeXt
        shell: bash
        run: |
          set -euo pipefail
          image="pretextbook/pretext:1.16"
          docker pull "$image"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/source" \
            --workdir /source \
            --entrypoint /bin/bash \
            "$image" \
            -lc 'set -euo pipefail
              python -m pip install --requirement requirements.txt "lxml<6.1.3"
              python3 scripts/prepare_pretext_runestone_cache.py
              PATH="/source/.realmat/pretext-wrapper:$PATH" pretext build web --no-generate'

      - name: Validar saída HTML
        shell: bash
        run: |
          set -euo pipefail
          test -s output/web/index.html

      - name: Preparar conteúdo do Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a output/web/. _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Implantar artefato
        id: deployment
        uses: actions/deploy-pages@v5
