name: "Publicar HTML traduzido — Álgebra Abstrata"

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar HTML com PreTeXt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout do livro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependências de compilação
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            texlive-full \
            latexmk \
            poppler-utils \
            pdf2svg \
            nodejs \
            npm
          python -m pip install --requirement requirements.txt "lxml<6.1.3"

      - name: Preparar assets já gerados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-assets
          cp -a images/. generated-assets/

      - name: Preparar fallback dos serviços Runestone
        shell: bash
        run: python3 scripts/prepare_pretext_runestone_cache.py

      - name: Compilar HTML
        shell: bash
        run: pretext build web --no-generate

      - name: Validar saída HTML
        shell: bash
        run: |
          set -euo pipefail
          test -s output/web/index.html

      - name: Preparar conteúdo do Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a output/web/. _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Implantar artefato
        id: deployment
        uses: actions/deploy-pages@v5
