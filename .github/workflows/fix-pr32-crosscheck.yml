name: Corrigir varredura cruzada do PR 32

on:
  push:
    branches:
      - review/aata-second-audit-20261015
    paths:
      - '.audit/fix_pr32_crosscheck.py'
      - '.github/workflows/fix-pr32-crosscheck.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: review/aata-second-audit-20261015
          fetch-depth: 0

      - name: Aplicar e verificar correções
        run: python .audit/fix_pr32_crosscheck.py

      - name: Conferir diff
        run: git diff --check

      - name: Registrar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fields.xml src/crypt.xml src/domains.xml src/groups.xml src/isomorph.xml src/matrix.xml src/galois.xml
          git add audit/second-review-2026-10-15/findings.jsonl audit/second-review-2026-10-15/report.md audit/second-review-2026-10-15/interventions.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração a registrar."
          else
            git commit -m "revisão: corrige pendências da varredura cruzada final"
            git push origin HEAD:review/aata-second-audit-20261015
          fi
