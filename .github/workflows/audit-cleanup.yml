name: Limpeza final da auditoria AATA

on:
  push:
    branches:
      - review/aata-second-audit-20261015

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/aata-second-audit-20261015
          fetch-depth: 0
      - name: Configurar Git
        run: |
          git config user.name "realmat-audit-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Corrigir resíduos detectados na inspeção do diff
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def rep(path, old, new, expected=None):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if expected is not None and n != expected:
                  raise SystemExit(f'{path}: esperado {expected}, encontrado {n}: {old}')
              if n:
                  p.write_text(s.replace(old,new),encoding='utf-8')
              return n

          rep('src/finite.xml',
              '<m>{\\mathbb Z}_2^n</m> com elementos de <m>{\\mathbb Z}_2[x] / \\langle x^n - 1 \\rangle</m>.\n        Dessa maneira, podemos interpretar um código linear como um subconjunto de <m>{\\mathbb Z}[x] / \\langle x^n - 1 \\rangle</m>.',
              '<m>{\\mathbb Z}_2^n</m> com elementos de <m>{\\mathbb Z}_2[x] / \\langle x^n - 1 \\rangle</m>.\n        Dessa maneira, podemos interpretar um código linear como um subconjunto de <m>{\\mathbb Z}_2[x] / \\langle x^n - 1 \\rangle</m>.',1)
          rep('src/finite.xml',
              'o grupo multiplicativo dos elementos não nulos de um subcorpo formarão um subgrupo do grupo cíclico\n          e necessariamente serão cíclicos.',
              'o grupo multiplicativo dos elementos não nulos de um subcorpo formará um subgrupo do grupo cíclico\n          e necessariamente será cíclico.',1)
          rep('src/sylow.xml','toda automorfismo interno','todo automorfismo interno',1)

          total=0
          for p in Path('src').glob('*.xml'):
              s=p.read_text(encoding='utf-8')
              n=s.count('</m>-gono')
              if n:
                  p.write_text(s.replace('</m>-gono','</m>-ágono'),encoding='utf-8')
                  total += n
          print('n-ágono markup fixes:', total)

          for p in Path('src').glob('*.xml'):
              ET.parse(p)
          PY
      - name: Remover workflow temporário, commitar e enviar
        run: |
          rm .github/workflows/audit-cleanup.yml
          git add -A
          git commit -m "revisão: corrige resíduos da inspeção final do diff"
          git diff --check HEAD~1..HEAD
          git push origin HEAD:review/aata-second-audit-20261015
