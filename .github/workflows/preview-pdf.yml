name: "Prévia do PDF — AATA"

on:
  pull_request:
    branches: [master]
    paths:
      - ".realmat/book.json"
      - ".github/workflows/preview-pdf.yml"
      - "project.ptx"
      - "requirements.txt"
      - "scripts/**"
      - "src/frontmatter.xml"

permissions:
  contents: read

jobs:
  preview:
    name: Compilar e anexar PDF de prévia
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout do livro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout dos scripts REALMat
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: projetorealmat/.github
          ref: v3
          path: .realmat-central

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependências de compilação
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y texlive-full latexmk poppler-utils pdf2svg nodejs npm
          python -m pip install --requirement requirements.txt "lxml<6.1.3"

      - name: Validar conteúdo específico do livro
        run: python3 scripts/prepare_pretext_runestone_cache.py

      - name: Compilar PDF
        env:
          BUILD_SYSTEM: pretext
          PDF_NAME: aata.pdf
          PRETEXT_PROJECT_FILE: project.ptx
          PRETEXT_PDF_TARGET: print
          PRETEXT_GENERATE: "false"
          PRETEXT_CACHED_ASSETS_SOURCE: images
          PRETEXT_CACHED_ASSETS_DESTINATION: generated-assets
        run: bash .realmat-central/scripts/build-book.sh

      - name: Verificar PDF
        run: |
          set -euo pipefail
          pdftotext -layout aata.pdf "${RUNNER_TEMP}/aata-preview.txt"
          test -s "${RUNNER_TEMP}/aata-preview.txt"

      - name: Disponibilizar PDF para revisão
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aata-pdf-preview-pr-${{ github.event.pull_request.number }}
          path: aata.pdf
          if-no-files-found: error
          retention-days: 7
